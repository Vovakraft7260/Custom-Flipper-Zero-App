# Builds the Android app (APK) in the cloud on every push and pull request.
# Download it from the run's "Artifacts" section.
# Every push to main (when the signing key secrets are set) also publishes a
# release "build-N" with the APK. The app checks that release to offer updates.
# Pushing a tag like v1.0.0 publishes a named release the same way.
name: Build APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.6.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build web app and copy it into the Android project
        run: npm run android:sync

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Load signing key (if set up)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OILRIG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "OILRIG_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing key secret: building a debug APK instead."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: android
        env:
          OILRIG_KEYSTORE_PASSWORD: ${{ secrets.OILRIG_KEYSTORE_PASSWORD }}
          OILRIG_KEY_ALIAS: ${{ secrets.OILRIG_KEY_ALIAS }}
          OILRIG_KEY_PASSWORD: ${{ secrets.OILRIG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/0ilrig-trmnl-$APP_VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/0ilrig-trmnl-$APP_VERSION_NAME-debug.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: 0ilrig-trmnl-apk
          path: 0ilrig-trmnl-*.apk
          if-no-files-found: error

      - name: Publish release (main branch or version tag)
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::Not publishing: APK is debug-signed. Add the OILRIG_* signing secrets so updates install over the old app."
            exit 0
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$GITHUB_RUN_NUMBER"; fi
          NOTES="build $GITHUB_RUN_NUMBER

          $(git log -1 --pretty=%B)"
          gh release create "$TAG" 0ilrig-trmnl-*.apk --target "$GITHUB_SHA" \
            --title "0ilrig Trmnl $APP_VERSION_NAME" --notes "$NOTES" --latest

# Rebuilds the signal library's file list and the asset pack list once a week (and when the source
# list changes) and publishes it on the "library-index" branch, where the
# app downloads it from.
name: Library index

on:
  schedule:
    - cron: '17 4 * * 1' # Mondays
  push:
    branches: [main]
    paths: ['scripts/library-sources.json', 'scripts/build-library-index.mjs', 'scripts/build-packs-index.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency: library-index

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build index
        run: |
          node scripts/build-library-index.mjs "$RUNNER_TEMP/work" "$RUNNER_TEMP/index.json"
          node scripts/build-packs-index.mjs "$RUNNER_TEMP/work-packs" "$RUNNER_TEMP/packs.json"
      - name: Publish to library-index branch
        run: |
          cd "$RUNNER_TEMP"
          rm -rf pub && mkdir pub && cd pub
          git init -q -b library-index
          cp ../index.json index.json
          cp ../packs.json packs.json
          printf '# Signal library index\n\nGenerated by the Library index workflow. Do not edit.\n' > README.md
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Library index $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" library-index
